name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gdscript-lint:
    name: GDScript lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install pinned tools
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Lint GDScript
        run: gdlint addons sample tests

      - name: Check GDScript formatting
        run: gdformat --check addons sample tests

  gdscript-runtime:
    name: GDScript architecture
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: "4.7.1"
      GODOT_LINUX_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libgl1-mesa-dri \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            xauth \
            xvfb

      - name: Install verified Godot
        run: |
          archive="$RUNNER_TEMP/godot.zip"
          binary="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          sudo install -m 0755 "$binary" /usr/local/bin/godot
          test "$(godot --version | cut -d. -f1-3)" = "$GODOT_VERSION"

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Test structured error feedback
        run: |
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_runtime_failure_contract.gd
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_error_registry.gd
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_error_gallery.gd

      - name: Test parser and dialogue services
        run: |
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_gdscript_architecture.gd
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_program_vm.gd
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_dialogue_lifecycle.gd
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_dialogue_external_reentry.gd
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_dialogue_localization_lifecycle.gd
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_default_dialogue_template.gd
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_dialogue_history.gd
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_dialogue_rollback.gd
          python3 .github/scripts/run_godot_test.py tests/dialogue/test_dialogue_rollback_stress.gd

      - name: Guard KonadoScript performance complexity
        run: >-
          python3 .github/scripts/run_godot_test.py
          tests/dialogue/test_konado_script_performance.gd

      - name: Test background transitions
        run: >-
          python3 .github/scripts/run_godot_test.py
          tests/background/test_background_transition_layer.gd

      - name: Test character state transitions
        run: |
          python3 .github/scripts/run_godot_test.py tests/character/test_actor_initial_state.gd
          python3 .github/scripts/run_godot_test.py tests/character/test_actor_state_transition.gd
          python3 .github/scripts/run_godot_test.py tests/character/test_actor_motion.gd
          python3 .github/scripts/run_godot_test.py tests/character/test_character_transition_frame.gd
          xvfb-run -a python3 .github/scripts/run_godot_test.py --rendering tests/character/test_character_transition_rendering.gd

      - name: Test KonadoScript editor integration
        run: |
          python3 .github/scripts/run_godot_test.py tests/editor/test_konado_script_runtime_loader.gd
          python3 .github/scripts/run_godot_test.py --editor tests/editor/test_konado_script_editor_support.gd
          python3 .github/scripts/run_godot_test.py --editor tests/editor/test_konado_script_locale_selector.gd
          python3 .github/scripts/run_godot_test.py --editor tests/editor/test_konado_script_language_service.gd
          python3 .github/scripts/run_godot_test.py --editor tests/editor/test_konado_script_editor_services.gd
          python3 .github/scripts/run_godot_test.py --editor tests/editor/test_project_migration.gd
          python3 .github/scripts/run_godot_test.py tests/editor/test_konado_script_documentation_examples.gd

      - name: Test internationalization
        run: |
          python3 .github/scripts/run_godot_test.py tests/localization/test_localization.gd
          python3 .github/scripts/run_godot_test.py tests/localization/test_localization_autoload.gd

      - name: Test auxiliary plugins
        run: |
          python3 .github/scripts/run_godot_test.py tests/addons/test_auxiliary_plugins.gd
          python3 .github/scripts/run_godot_test.py tests/addons/test_achievement_ui.gd

  dotnet-build:
    name: Konado.NET compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Compile Konado.NET runtime and editor integration
        run: |
          dotnet build .github/scripts/Konado.CI.csproj \
            --configuration Release \
            --nologo \
            --warnaserror
          dotnet build .github/scripts/Konado.CI.csproj \
            --configuration Debug \
            --nologo \
            --warnaserror

      - name: Check C# formatting
        run: >-
          dotnet format .github/scripts/Konado.CI.csproj
          --verify-no-changes
          --no-restore

  dotnet-runtime:
    name: Konado.NET runtime
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:mono-4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Run Konado.NET inside Godot
        run: bash .github/scripts/run_dotnet_runtime_tests.sh

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugins/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: plugins/vscode/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugins/vscode/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and package extension
        run: pnpm package:vsix

      - name: Verify VSIX
        run: test -s dist/konado.vsix

  resource-integrity:
    name: Resource integrity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Test workflow helpers
        run: python -m unittest discover -s tests/tools -p "test_*.py"

      - name: Check repository architecture
        run: python tests/tools/repository_architecture_check.py

      - name: Check plugin resource boundaries
        run: >-
          python .github/scripts/check_plugin_resource_boundaries.py
          "res://addons/konado/" "./addons/konado/"

      - name: Check plugin metadata
        run: python .github/scripts/check_plugin_configs.py

      - name: Check documentation resource paths
        run: >-
          python .github/scripts/check_doc_resource_paths.py
          docs/zh/latest docs/en/latest docs/ja/latest docs/ko/latest docs/tc/latest

      - name: Check structured error codes against sources and docs
        run: python .github/scripts/check_error_codes.py

      - name: Check Konado.NET documentation contracts
        run: >-
          python .github/scripts/check_dotnet_docs.py
          docs/zh/latest docs/en/latest docs/ja/latest docs/ko/latest docs/tc/latest
